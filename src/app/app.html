@if (!isLoading) {
  <header>
    <section>
      <div>
        <button
          tuiIconButton
          appearance="flat-grayscale"
          iconStart="@tui.chevron-left"
          size="m"
          type="button"
          [disabled]="year === startYear"
          (click)="onPrevYear()"
        ></button>

        <h1>{{ year }}</h1>

        <button
          tuiIconButton
          appearance="flat-grayscale"
          iconStart="@tui.chevron-right"
          size="m"
          type="button"
          [disabled]="year === startYear + 10"
          (click)="onNextYear()"
        ></button>
      </div>

      <section>
        <h2>Remaining PTO:</h2>

        <span [ngClass]="{ success: remaining > 7, danger: remaining <= 7 }">
          {{ remaining }}
        </span>
      </section>
    </section>
  </header>

  <div>
    @for (month of months; track month) {
      <tui-calendar
        [title]="hoveredDay || ''"
        [markerHandler]="markerHandler"
        [maxViewedMonth]="month"
        [minViewedMonth]="month"
        [month]="month"
        [showAdjacent]="false"
        [value]="taken"
        (dayClick)="onDayClick($event)"
        (hoveredItemChange)="onHoveredDayChange($event)"
      />
    }
  </div>

  <footer>
    <div>
      <div>
        <div class="t-dot"></div>

        <span>Public Holidays</span>
      </div>
    </div>

    <div>
      <tui-textfield tuiTheme="dark">
        <label tuiLabel>Enter your PTO</label>

        <input tuiInputNumber [formControl]="allowanceControl" />
      </tui-textfield>

      <tui-error [error]="[] | tuiFieldError | async" [formControl]="allowanceControl" />
    </div>
  </footer>
} @else {
  <div><tui-loader /></div>
}
